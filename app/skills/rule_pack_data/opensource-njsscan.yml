- id: oss-njsscan-handlebars_safestring
  pattern-either:
  - pattern: $X.SafeString(...)
  - pattern: new Handlebars.SafeString(...)
  message: When you use SafeString or triple curly braces ({{{ }}}), Handlebars does not escape the content, allowing raw HTML to be rendered in the browser. This is useful if you want to insert valid HTML content into your template, like bold text (<strong>) or links (<a>), but it becomes dangerous if you are dealing with untrusted or user-generated content, as it can cause a Cross-site scripting attack (XSS). You should only use SafeString when the content is trusted. For example, if the content is generated by the server and does not come from user input or an untrusted source. If you are dealing with user-generated content, make sure to sanitize it to remove any malicious scripts before marking it as "safe".
  languages:
  - javascript
  - typescript
  severity: ERROR
  metadata:
