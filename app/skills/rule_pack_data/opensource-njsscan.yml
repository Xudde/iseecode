rules:
- id: oss-njsscan-node_nosqli_injection
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.$PROP
      - pattern: $REQ.$PROP.$FIELD
      - pattern: $REQ.$PROP[$KEY]
    - metavariable-regex:
        metavariable: $REQ
        regex: (?i)^(req|request)$
    - metavariable-regex:
        metavariable: $PROP
        regex: ^(body|query|params|headers|cookies)$
  pattern-sanitizers:
  - patterns:
    - pattern: $SANITIZE(...)
    - pattern-either:
      - pattern-inside: '$SANITIZE = require(''mongo-sanitize'')

          ...

          '
      - pattern-inside: 'import $SANITIZE from ''mongo-sanitize''

          ...

          '
      - pattern-inside: 'import * as $SANITIZE from ''mongo-sanitize''

          ...

          '
      - pattern-inside: 'import {..., $SANITIZE, ...} from ''mongo-sanitize''

          ...

          '
  pattern-sinks:
  - pattern: $OBJ.findOne($QUERY, ...)
  pattern-not-sinks:
  - patterns:
    - pattern: $OBJ.findOne($QUERY, ...)
    - pattern-either:
      - pattern-inside: '$SEQUELIZE = require(''sequelize'')

          ...

          $SEQUELIZE(...)

          ...

          '
      - pattern-inside: 'import $SEQUELIZE from ''sequelize''

          ...

          $SEQUELIZE(...)

          ...

          '
  message: Untrusted user input in findOne() function can result in NoSQL Injection.
  languages:
  - javascript
  - typescript
  severity: ERROR
  metadata:
    owasp-web: a1
    cwe: cwe-943
    category: security
    license: LGPL-3.0
    license_url: https://github.com/ajinabraham/njsscan/blob/master/LICENSE
    source: njsscan 1.0.2 node_nosqli_injection
    source_url: https://files.pythonhosted.org/packages/74/21/74f9263c70e40f91e7b51e0bc3243f896a489dd42766059e834603dcf77a/njsscan-1.0.2.tar.gz
    source_version: 1.0.2
    source_sha256: 7d7361822e61cbf2ccab1999bd9596d71503f1042b270e1227989b40f9f69ddc
    source_rule: node_nosqli_injection
    dedupe_key: njsscan:node_nosqli_injection
  paths:
    exclude:
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/test_*/**'
    - '**/docs/**'
    - '**/doc/**'
    - '**/examples/**'
    - '**/example/**'
    - '**/fixtures/**'
    - '**/e2e/**'
    - '**/vendor/**'
    - '**/node_modules/**'
    - '**/.venv/**'
    - '**/venv/**'
    - '**/site-packages/**'
    - '**/third_party/**'
    - '**/dist/**'
    - '**/build/**'
    - '**/*.min.js'
